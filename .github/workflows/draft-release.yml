name: Create draft release and compile artifacts
on:
  workflow_call:
    inputs:
      workflow_ref:
        description: Reference for this workflow to pin version-dependent calls
        required: true
        type: string
      version:
        description: Version number
        required: true
        type: string
      validate-only:
        description: Only parse and validate the file publish.config.json
        required: true
        type: boolean
        default: false

# permissions required to write to the github release
permissions:
  contents: write

jobs:
  load-config:
    name: Load and validate configuration
    uses: ./.github/workflows/load-config.yml
    with:
      # use the current reference to which the tag and draft is being created
      # this branch is expected to be the main branch with the configuration file
      repository_ref: ${{ github.ref }}
      workflow_ref: ${{ inputs.workflow_ref }}
    # outputs.config


  create-release:
    name: Create draft release
    needs: load-config
    runs-on: ubuntu-latest
    # skip if validate only is enabled
    if: ${{ inputs.validate-only != true }}
    outputs:
      # URL for assets uploading
      upload_url: ${{ steps.cr.outputs.upload_url }}
      release_id: ${{ steps.cr.outputs.id }}
      tag: ${{ steps.tag_name.outputs.tag }}
    steps:
      - name: Construct tag name
        id: tag_name
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Prepend "v" to the version for the tag name
          TAG="v${INPUT_VERSION#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: cr
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: ${{ steps.tag_name.outputs.tag }}
          draft: true
          prerelease: false

  # Executed for each configured branch
  build-artifact:
    name: Build artifact - ${{ matrix.artifact.id }}
    needs: [load-config, create-release]
    # skip if validate only is enabled
    if: ${{ inputs.validate-only != true }}
    strategy:
      fail-fast: false
      matrix:
        # Parse the full config JSON and extract only the artifacts array
        artifact: ${{ fromJson(needs.load-config.outputs.config).artifacts }}

    uses: ./.github/workflows/per-branch-compile.yml
    with:
      version: ${{ inputs.version }}
      tag_name: ${{ needs.create-release.outputs.tag }}
      branch: ${{ matrix.artifact.branch }}
      loaders_json: ${{ toJson(matrix.artifact.loaders) }}
      game_versions_json: ${{ toJson(matrix.artifact.game_versions) }}
      release_id: ${{ needs.create-release.outputs.release_id }}
      release_upload_url: ${{ needs.create-release.outputs.upload_url }}
      version_properties_json: ${{ toJson(matrix.artifact.version_properties) }}
      java_version: ${{ matrix.artifact.java_version }}
      file_glob: ${{ matrix.artifact.file_glob }}
      workflow_ref: ${{ inputs.workflow_ref }}
