name: Create draft release and compile artifacts
on:
  workflow_call:
    inputs:
      workflow_ref:
        description: Reference for this workflow to pin version-dependent calls
        required: true
        type: string
      version:
        description: Version number
        required: true
        type: string
      branches:
        description: Comma-delimited list of branch names that should be included in the release, leave empty to release all configured branches.
        required: false
        type: string
      validate-only:
        description: Only parse and validate the file publish.config.json
        required: true
        type: boolean
        default: false

# permissions required to write to the github release
permissions:
  contents: write

jobs:
  load-config:
    name: Load and validate artifact configuration
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.export.outputs.tag }}
      artifacts: ${{ steps.export.outputs.artifacts }}
    steps:
      - name: Checkout caller repository
        # Checksout the mod repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: repository

      - name: Checkout workflow repository
        # Checksout the repository of this workflow to use the files
        uses: actions/checkout@v7
        with:
          repository: lukaskabc/Minecraft-Mod-Publish-Workflows
          ref: ${{ inputs.workflow_ref }}
          path: workflow
          fetch-depth: 0

      - name: Setup Node.js
        # setup nodejs for JSON schema validation with AJV
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install JSON schema validator
        run: npm install --ignore-scripts -g ajv-cli ajv-formats

      - name: Validate publish config
        run: |
          test -f repository/publish.config.json
          test -f workflow/artifacts.schema.json

          ajv validate \
            -s workflow/artifacts.schema.json \
            -d repository/publish.config.json \
            --spec=draft7 \
            -c ajv-formats \
            --strict=true
      
      - name: Export artifacts output
        id: export
        shell: bash
        env:
          INPUT_BRANCHES: ${{ inputs.branches }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Prepend "v" to the version for the tag name
          TAG="v${INPUT_VERSION#v}"

          # Normalizes and converts input branch filter to a JSON array using only jq
          FILTER_JSON=$(jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length>0))' <<< "$INPUT_BRANCHES")
          
          # Ensure the config file exists
          CONFIG_FILE="repository/publish.config.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: $CONFIG_FILE does not exist."
            exit 1
          fi
          
          # Applies filter if it is not empty
          ARTIFACTS_ARRAY=$(jq -c --argjson filter "$FILTER_JSON" '[ .artifacts[] | select(($filter | length == 0) or (.branch as $b | $filter | index($b))) ]' "$CONFIG_FILE")
          
          # Ensure the filtered artifact is not empty
          ARTIFACTS_LENGTH=$(echo "$ARTIFACTS_ARRAY" | jq 'length')
          if [ "$ARTIFACTS_LENGTH" -eq 0 ]; then
            echo "Warning: No matching branches found in the config."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifacts=$ARTIFACTS_ARRAY" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: load-config
    runs-on: ubuntu-latest
    # skip if validate only is enabled
    if: ${{ inputs.validate-only != true }}
    outputs:
      # URL for assets uploading
      upload_url: ${{ steps.cr.outputs.upload_url }}
      release_id: ${{ steps.cr.outputs.id }}
    steps:
      - name: Create draft release
        id: cr
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.load-config.outputs.tag }}
          name: ${{ needs.load-config.outputs.tag }}
          draft: true
          prerelease: false

  # Executed for each configured branch
  build-artifact:
    name: Build artifact - ${{ matrix.artifact.branch }}
    needs: [load-config, create-release]
    # skip if validate only is enabled
    if: ${{ inputs.validate-only != true }}
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJson(needs.load-config.outputs.artifacts) }}

    uses: ./.github/workflows/per-branch-compile.yml
    with:
      version: ${{ inputs.version }}
      tag_name: ${{ needs.load-config.outputs.tag }}
      branch: ${{ matrix.artifact.branch }}
      loaders_json: ${{ toJson(matrix.artifact.loaders) }}
      game_versions_json: ${{ toJson(matrix.artifact.game_versions) }}
      release_id: ${{ needs.create-release.outputs.release_id }}
      release_upload_url: ${{ needs.create-release.outputs.upload_url }}
      version_properties_json: ${{ toJson(matrix.artifact.version_properties) }}
      java_version: ${{ matrix.artifact.java_version }}
      workflow_ref: ${{ inputs.workflow_ref }}
