name: Publish mod to several platforms
on:
  workflow_call:
    inputs:
      workflow_ref:
        description: Reference for this workflow to pin version-dependent calls
        required: true
        type: string
      release_tag:
        description: The tag with associated release (e.g. v1.2.3)
        required: true
        type: string
      dry_run:
        description: If true, the files wont be published and the configuration will be logged instead.
        required: false
        default: false
        type: boolean
    secrets:
      CURSEFORGE_API_KEY:
        required: false
      MODRINTH_API_KEY:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

env:
  MOD_PUBLISH_JAVA_VERSION: 25

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Checkout repositories, download release assets and compute the publish matrix
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      artifact_ids: ${{ steps.matrix.outputs.artifact_ids }}
      curseforge_enabled: ${{ steps.matrix.outputs.curseforge_enabled }}
      modrinth_enabled: ${{ steps.matrix.outputs.modrinth_enabled }}
      discord_enabled: ${{ steps.matrix.outputs.discord_enabled }}
    steps:
      - name: Checkout the main branch in caller repository
        # Checksout the mod repository at the release tag - this will provide the configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: repository

      - name: Checkout workflow repository
        # Checksout the repository of this workflow to use the files
        uses: actions/checkout@v7
        with:
          repository: lukaskabc/Minecraft-Mod-Publish-Workflows
          ref: ${{ inputs.workflow_ref }}
          path: workflow
          fetch-depth: 1

      - name: Extract version without 'v' prefix
        id: extract_version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TARGET_DIR: 'workflow/publish/artifacts'
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir "$TARGET_DIR" --pattern "*.jar"
          ls -la "$TARGET_DIR"

      - name: Save release description to changelog.md
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq '.body' > workflow/publish/changelog.md

      - name: Prepare gradle wrapper
        run: chmod +x workflow/publish/gradlew

      - name: Compute artifact matrix and enabled platforms
        id: matrix
        run: |
          set -euo pipefail
          CONFIG=repository/publish.config.json
          echo "artifact_ids=$(jq -c '[.artifacts[].id]' "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "curseforge_enabled=$(jq -r '.curseforge_enabled' "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "modrinth_enabled=$(jq -r '.modrinth_enabled' "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "discord_enabled=$(jq -r '.discord_enabled' "$CONFIG")" >> "$GITHUB_OUTPUT"

      - name: Upload publish workspace
        # Give access to files for upcoming jobs
        uses: actions/upload-artifact@v7
        with:
          name: publish-workspace
          path: |
            workflow/
            repository/publish.config.json
          retention-days: 1

  publish-curseforge:
    needs: prepare
    if: needs.prepare.outputs.curseforge_enabled == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.id }} - Publish to CurseForge
    permissions: {}
    strategy:
      # Allow some tasks to succeed and do not cancel others if one fails
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.prepare.outputs.artifact_ids) }}
    steps:
      - name: Download publish workspace
        uses: actions/download-artifact@v8
        with:
          name: publish-workspace

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.MOD_PUBLISH_JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ${{ matrix.id }} - Publish CurseForge artifact
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          export CONFIG_JSON=$(cat repository/publish.config.json)
          chmod +x workflow/publish/gradlew
          cd workflow/publish
          ./gradlew "publishCurseforge-${ARTIFACT_ID}"

      - name: ${{ matrix.id }} - Upload publish mods result
        uses: actions/upload-artifact@v7
        with:
          name: modPublish-result-${{ matrix.id }}
          path: workflow/publish/build/publishMods/*.json
          if-no-files-found: 'error'
          retention-days: 1
  publish-modrinth:
    needs: prepare
    if: needs.prepare.outputs.modrinth_enabled == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.id }} - Publish to Modrinth
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.prepare.outputs.artifact_ids) }}
    steps:
      - name: Download publish workspace
        uses: actions/download-artifact@v8
        with:
          name: publish-workspace

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.MOD_PUBLISH_JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ${{ matrix.id }} - Publish Modrinth artifact
        shell: bash
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          export CONFIG_JSON=$(cat repository/publish.config.json)
          chmod +x workflow/publish/gradlew
          cd workflow/publish
          ./gradlew "publishModrinth-${ARTIFACT_ID}"

      - name: ${{ matrix.id }} - Upload publish mods result
        uses: actions/upload-artifact@v7
        with:
          name: modPublish-result-${{ matrix.id }}
          path: workflow/publish/build/publishMods/*.json
          if-no-files-found: 'error'
          retention-days: 1

  announce-discord:
    needs: [prepare, publish-curseforge, publish-modrinth]
    # !cancelled() - run always even if a dependency "failed (checked later)" or was skipped (disabled)
    # Check that prepare job succeeded
    # Check that discord is enabled
    # Check that both modrinth and curseforge jobs succeeded
    if: |
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.discord_enabled == 'true' &&
      (needs.publish-curseforge.result == 'success' || needs.publish-curseforge.result == 'skipped') &&
      (needs.publish-modrinth.result == 'success' || needs.publish-modrinth.result == 'skipped')
    runs-on: ubuntu-latest
    name: Send Discord announcement
    permissions: {}
    steps:
      - name: Download publish workspace
        uses: actions/download-artifact@v8
        with:
          name: publish-workspace

      - name: Download publish results
        uses: actions/download-artifact@v8
        with:
          pattern: modPublish-result-**
          merge-multiple: 'true'
      # TODO: will the files be downloaded to root or to the correct directory?

      - name: Debug - List files
        run: |
          ls -la workflow/publish/build/publishMods/
          ls -la .

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.MOD_PUBLISH_JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Announce on Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          export CONFIG_JSON=$(cat repository/publish.config.json)
          chmod +x workflow/publish/gradlew
          cd workflow/publish
          ./gradlew announceDiscord