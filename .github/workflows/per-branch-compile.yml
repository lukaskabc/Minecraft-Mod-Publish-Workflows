name: Per-branch bump version, compile and upload to github release draft

on:
  workflow_call:
    inputs:
      version:
        description: The new semantic version of the mod (e.g. 1.2.3)
        required: true
        type: string
      tag_name:
        description: Release tag name (e.g. v1.2.3)
        required: true
        type: string
      branch:
        description: Branch to build from and push to
        required: true
        type: string
      loaders_json:
        description: JSON array of loaders
        required: true
        type: string
      game_versions_json:
        description: JSON array of game versions
        required: true
        type: string
      release_id:
        description: GitHub release ID
        required: true
        type: string
      release_upload_url:
        description: GitHub release upload URL
        required: true
        type: string
      version_properties_json:
        description: JSON array [{file,property}] where version should be set; default to gradle.properties:mod_version when empty
        required: false
        type: string
        default: "[]"
      java_version:
        description: Java version for Gradle build (e.g. 17, 21)
        required: true
        type: string
      workflow_ref:
        description: Reference for this workflow to pin version-dependent calls
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    name: Bump version, build artifact and upload to github release draft
    steps:
      - name: Checkout caller repository
        # Checksout the mod repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          path: repository

      - name: Checkout workflow repository
        # Checksout the repository of this workflow to use the files
        uses: actions/checkout@v7
        with:
          repository: lukaskabc/Minecraft-Mod-Publish-Workflows
          ref: ${{ inputs.workflow_ref }}
          path: workflow
          fetch-depth: 0

      - name: Validate semantic version input
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          
          # https://semver.org/
          SEMVER_REGEX='^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
          
          # Using grep for regex extensions compatibility
          if ! echo "$INPUT_VERSION" | grep -qP "$SEMVER_REGEX"; then
            echo "Input version '$INPUT_VERSION' is not a valid semantic version."
            exit 1
          fi

      - name: Configure git identity
        # https://github.com/actions/checkout/pull/1707
        # Official github actions bot account
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        id: release_commit
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_PROPERTIES_JSON: ${{ inputs.version_properties_json }}
        run: |
          set -euo pipefail
          cd repository
          "../workflow/set-version.sh" \
            "$INPUT_VERSION" \
            "$INPUT_VERSION_PROPERTIES_JSON" \
            "[chore(release)] set version to $INPUT_VERSION"
          
          # Save the release commit hash to checkout later
          echo "commit_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute next dev version
        id: next
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          core="${INPUT_VERSION%%[-+]*}"
          IFS='.' read -r major minor patch <<< "$core"
          next_patch=$((patch + 1))
          next_dev="${major}.${minor}.${next_patch}-alpha"
          echo "next_dev=$next_dev" >> "$GITHUB_OUTPUT"

      - name: Set next dev version
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.next.outputs.next_dev }}
          INPUT_VERSION_PROPERTIES_JSON: ${{ inputs.version_properties_json }}
        run: |
          set -euo pipefail
          cd repository
          "../workflow/set-version.sh" \
            "$NEXT_VERSION" \
            "$INPUT_VERSION_PROPERTIES_JSON" \
            "[chore(release)] set development version to $NEXT_VERSION"

      - name: Push branch changes
        shell: bash
        run: |
          set -euo pipefail
          cd repository
          git push origin "HEAD:${{ inputs.branch }}"

      - name: Checkout release commit
        shell: bash
        run: |
          set -euo pipefail
          cd repository
          # Checking out the specific hash saved from the release commit
          git checkout ${{ steps.release_commit.outputs.commit_hash }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        # Validates gradle wrappers

      - name: Build with Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd repository
          chmod +x ./gradlew
          ./gradlew build

      - name: Build asset name
        id: asset
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          LOADERS_JSON: ${{ inputs.loaders_json }}
          GAME_VERSIONS_JSON: ${{ inputs.game_versions_json }}
        run: |
          set -euo pipefail
          loaders=$(echo "$LOADERS_JSON" | jq -r 'join("-")')
          games=$(echo "$GAME_VERSIONS_JSON" | jq -r 'join("-")')
          echo "suffix=$VERSION-${games}-${loaders}" >> "$GITHUB_OUTPUT"

      - name: Upload jars to release draft
        shell: bash
        env:
          SUFFIX: ${{ steps.asset.outputs.suffix }}
          # Used by the gh release
          RELEASE_ID: ${{ inputs.release_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          cd repository
          
          files=(**/build/libs/*"${SUFFIX}".jar)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No JAR files found matching **/build/libs/*${SUFFIX}.jar"
            exit 1
          fi
          
          for f in "${files[@]}"; do
            gh release upload "${inputs.tag_name}" "$f"
          done