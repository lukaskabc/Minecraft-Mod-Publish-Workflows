services:
  # Local development: live reload via Vite's dev server, with source files
  # bind-mounted so edits on the host are picked up immediately.
  #   docker compose up dev
  #   -> http://localhost:5173
  dev:
    build:
      context: .
      target: build
    command: sh -c "npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
